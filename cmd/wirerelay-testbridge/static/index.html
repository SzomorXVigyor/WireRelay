<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WireRelay Bridge Tester</title>

  <style>
    :root {
      --bg: #111315;
      --panel: #1a1d21;
      --panel2: #16191c;
      --border: #32363b;
      --text: #e5e7eb;
      --muted: #8b949e;
      --green: #2ecc71;
      --orange: #f5a524;
      --red: #e5484d;
      --blue: #4ea1ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg);
      padding-bottom: 15px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    .subtitle {
      color: var(--muted);
      margin-top: 3px;
    }

    .topbar {
      margin-top: 15px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .topbar label {
      color: var(--muted);
      white-space: nowrap;
    }

    .topbar input {
      flex: 1;
    }

    .status {
      color: var(--green);
      font-size: 13px;
      white-space: nowrap;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 20px;
    }

    .card h2 {
      margin: 0 0 18px;
      font-size: 17px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 2fr 1fr 1fr auto;
      gap: 12px;
      align-items: end;
    }

    .field {
      display: flex;
      flex-direction: column;
    }

    .field label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    input,
    select,
    button {
      height: 38px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--panel2);
      color: var(--text);
      padding: 0 10px;
      font-size: 14px;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: var(--blue);
    }

    button {
      cursor: pointer;
      background: var(--blue);
      color: white;
      font-weight: 600;
    }

    button:hover {
      filter: brightness(1.08);
    }

    button.small {
      height: 30px;
      padding: 0 10px;
      font-size: 12px;
    }

    button.stop {
      background: var(--red);
    }

    button.copy {
      background: #444;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      color: var(--muted);
      font-size: 12px;
      padding: 10px;
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 12px 10px;
      border-bottom: 1px solid #26292d;
    }

    tbody tr:hover {
      background: #1f2328;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
    }

    .tcp {
      background: #21496d;
      color: #bfe2ff;
    }

    .udp {
      background: #694719;
      color: #ffd38c;
    }

    code {
      font-family: Consolas, Menlo, monospace;
      font-size: 13px;
    }

    .actions {
      display: flex;
      gap: 6px;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 30px;
    }

    .running {
      color: var(--green);
    }

    @media(max-width:950px) {

      .form-grid {
        grid-template-columns: 1fr;
      }

      .topbar {
        flex-direction: column;
        align-items: stretch;
      }

    }
  </style>
</head>

<body>

  <div class="container">

    <header>

      <h1>WireRelay Bridge Tester</h1>

      <div class="subtitle">
        Manual testing utility for WireRelay socket bridges
      </div>

      <div class="topbar">
        <label>Relay Host</label>
        <input id="relay_addr" placeholder="Loading...">
        <div class="status">
          ● Auto refresh every 5s
        </div>
      </div>

    </header>

    <div class="card">

      <h2>Create Bridge</h2>

      <form id="bridgeForm">

        <div class="form-grid">

          <div class="field">
            <label>Name</label>
            <input id="name" placeholder="office-vnc" required>
          </div>

          <div class="field">
            <label>Local Proto</label>
            <select id="source_proto">
              <option>TCP</option>
              <option>UDP</option>
            </select>
          </div>

          <div class="field">
            <label>Local Port</label>
            <input id="source_port" type="number" placeholder="5900" required>
          </div>

          <div class="field">
            <label>Target Host</label>
            <input id="target_host" placeholder="192.168.1.50" required>
          </div>

          <div class="field">
            <label>Target Port</label>
            <input id="target_port" type="number" placeholder="5900" required>
          </div>

          <div class="field">
            <label>Target Proto</label>
            <select id="target_proto">
              <option>TCP</option>
              <option>UDP</option>
            </select>
          </div>

          <button type="submit">
            Create
          </button>

        </div>

      </form>

    </div>

    <div class="card">

      <h2>Active Bridges</h2>

      <div style="overflow:auto">

        <table>

          <thead>

            <tr>
              <th>Name</th>
              <th>Local</th>
              <th>Target</th>
              <th>Relay</th>
              <th>Status</th>
              <th>Test</th>
              <th>Actions</th>
            </tr>

          </thead>

          <tbody id="bridgeTableBody">

            <tr>
              <td colspan="7" class="empty">
                Loading bridges...
              </td>
            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>

  <script>

    async function loadConfig() {

      try {

        const res = await fetch("/api/config");
        const cfg = await res.json();

        document.getElementById("relay_addr").value =
          cfg.default_relay_addr || "localhost:9000";

      } catch {

        document.getElementById("relay_addr").value = "localhost:9000";

      }

    }

    async function fetchBridges() {

      const res = await fetch("/api/bridges");
      const bridges = await res.json();

      const tbody = document.getElementById("bridgeTableBody");

      if (!bridges.length) {

        tbody.innerHTML = `
        <tr>
            <td colspan="7" class="empty">
                No active bridges.<br>
                Create one above.
            </td>
        </tr>`;

        return;
      }

      tbody.innerHTML = bridges.map(b => {

        const udp = b.source_proto === "UDP";

        const badge = udp
          ? '<span class="badge udp">UDP</span>'
          : '<span class="badge tcp">TCP</span>';

        const cmd = udp
          ? `nc -u localhost ${b.source_port}`
          : `nc localhost ${b.source_port}`;

        return `

<tr>

<td><strong>${b.name}</strong></td>

<td>
${badge}
&nbsp;
<code>:${b.source_port}</code>
</td>

<td>
<code>${b.target_host}:${b.target_port}</code>
(${b.target_proto})
</td>

<td>
<code>${b.relay_addr}</code>
</td>

<td class="running">
● Running
</td>

<td>
<code>${cmd}</code>
</td>

<td>

<div class="actions">

<button
class="small copy"
onclick="copyCmd('${cmd}')">
Copy
</button>

<button
class="small stop"
onclick="stopBridge('${b.id}')">
Stop
</button>

</div>

</td>

</tr>

`;

      }).join("");

    }

    async function copyCmd(cmd) {

      try {

        await navigator.clipboard.writeText(cmd);

      } catch {

        alert(cmd);

      }

    }

    document.getElementById("bridgeForm").addEventListener("submit", async e => {

      e.preventDefault();

      const payload = {

        name: document.getElementById("name").value,

        relay_addr: document.getElementById("relay_addr").value,

        source_port: Number(document.getElementById("source_port").value),

        source_proto: document.getElementById("source_proto").value,

        target_host: document.getElementById("target_host").value,

        target_port: Number(document.getElementById("target_port").value),

        target_proto: document.getElementById("target_proto").value

      };

      const res = await fetch("/api/bridges", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify(payload)

      });

      if (res.ok) {

        const relay = document.getElementById("relay_addr").value;

        document.getElementById("bridgeForm").reset();

        document.getElementById("relay_addr").value = relay;

        fetchBridges();

      } else {

        alert(await res.text());

      }

    });

    async function stopBridge(id) {

      await fetch("/api/bridges/" + id, {
        method: "DELETE"
      });

      fetchBridges();

    }

    loadConfig();
    fetchBridges();
    setInterval(fetchBridges, 5000);

  </script>

</body>

</html>
