syntax = "proto3";

package wirerelay.v1;

option go_package = "wirerelay/v1;wirerelayv1";

// WireRelayService provides health monitoring and network tunnel relaying over WireGuard.
service WireRelayService {
  // GetHealth returns current WireGuard interface health and handshake metrics.
  rpc GetHealth (HealthRequest) returns (HealthResponse);

  // PingTarget executes a TCP reachability probe to a target host inside the site network.
  rpc PingTarget (PingRequest) returns (PingResponse);

  // TunnelStream establishes a full-duplex, bidirectional byte stream to a target host over WireGuard.
  rpc TunnelStream (stream TunnelFrame) returns (stream TunnelFrame);

  // Configure pushes a WireGuard configuration over authenticated gRPC at startup.
  // The config is applied in-memory / container-private tmpfs and immediately shredded.
  rpc Configure (ConfigureRequest) returns (ConfigureResponse);

  // GetStats returns WireGuard traffic counters and relay stream runtime statistics.
  rpc GetStats (StatsRequest) returns (StatsResponse);
}

message StatsRequest {
  string interface = 1; // Optional: defaults to WIRERELAY_IFACE ("wg0")
}

message PeerTransferStats {
  string public_key = 1;
  uint64 rx_bytes = 2;
  uint64 tx_bytes = 3;
}

message StatsResponse {
  string interface = 1;
  uint64 rx_bytes = 2;               // Total WireGuard received bytes across peers
  uint64 tx_bytes = 3;               // Total WireGuard transmitted bytes across peers
  int64 uptime_seconds = 4;          // WireRelay daemon uptime in seconds
  uint32 active_streams = 5;         // Currently open TunnelStream RPCs
  uint32 max_streams = 6;            // Configured WIRERELAY_MAX_CONCURRENT_STREAMS cap
  uint64 dial_errors_total = 7;      // Total failed target dials in TunnelStream
  uint64 streams_rejected_total = 8; // Total TunnelStream calls rejected due to stream cap
  repeated PeerTransferStats peers = 9;
  int64 timestamp = 10;
  string error_message = 11;         // Non-empty if WireGuard transfer inspection failed
}

message ConfigureRequest {
  string interface = 1;  // Optional: defaults to WIRERELAY_IFACE ("wg0")
  string config = 2;     // Required: raw WireGuard .conf payload
  bool disable_ipv6 = 3; // Optional: strip IPv6 addresses/routes and force IPv4 endpoint resolution
}

message ConfigureResponse {
  bool applied = 1;
  string interface = 2;
  string error_message = 3;
}

message HealthRequest {
  string interface = 1; // Optional: Default is WIRERELAY_IFACE ("wg0")
}

enum TunnelStatus {
  TUNNEL_STATUS_UNSPECIFIED = 0;
  TUNNEL_STATUS_CONNECTED = 1;     // All peers handshaked <= 180s
  TUNNEL_STATUS_DEGRADED = 2;      // Worst peer 180s < Handshake <= 300s
  TUNNEL_STATUS_DISCONNECTED = 3;  // Any peer > 300s, never handshaked, or interface error
}

// HandshakeState distinguishes configuration errors (never handshaked), interface errors,
// and previously-connected tunnels whose handshake has gone stale.
enum HandshakeState {
  HANDSHAKE_STATE_UNSPECIFIED = 0;
  HANDSHAKE_STATE_CONNECTED = 1;        // Handshake <= 180s
  HANDSHAKE_STATE_DEGRADED = 2;         // 180s < Handshake <= 300s
  HANDSHAKE_STATE_STALE = 3;            // Previously handshaked, now > 300s
  HANDSHAKE_STATE_NEVER_HANDSHAKED = 4; // Interface up, peer timestamp == 0 (or no peers)
  HANDSHAKE_STATE_INTERFACE_ERROR = 5;  // wg show failed / interface missing
}

message PeerHealth {
  string public_key = 1;
  int64 handshake_age_seconds = 2; // -1 if never handshaked
  HandshakeState state = 3;
}

message HealthResponse {
  string interface = 1;
  TunnelStatus status = 2;
  int64 handshake_age_seconds = 3; // Worst peer age; -1 if never handshaked or interface error
  int64 timestamp = 4;
  HandshakeState handshake_state = 5;
  string error_message = 6;
  repeated PeerHealth peers = 7;
  bool configured = 8;             // True once WireGuard interface has been configured
}

message PingRequest {
  string target_host = 1; // IPv4, IPv6, or Domain Name
  uint32 target_port = 2; // Target port for TCP probe
  uint32 timeout_ms = 3;  // Timeout in milliseconds (default: 2000ms)
}

message PingResponse {
  bool reachable = 1;
  uint32 latency_ms = 2;
  string error_message = 3;
}

enum TransportProtocol {
  TRANSPORT_PROTOCOL_UNSPECIFIED = 0;
  TRANSPORT_PROTOCOL_TCP = 1;
  TRANSPORT_PROTOCOL_UDP = 2;
}

message TunnelHeader {
  string target_host = 1;           // IPv4, IPv6, or Domain Name
  uint32 target_port = 2;           // Destination Port
  TransportProtocol protocol = 3;   // TCP or UDP
  uint32 timeout_ms = 4;            // Custom dial timeout in ms (default: 5000ms)
}

message TunnelAck {
  bool success = 1;
  string error_message = 2;
  string local_bound_address = 3;
}

// TunnelClose signals graceful or remote-initiated stream termination (e.g. target EOF).
message TunnelClose {
  string reason = 1;
}

message TunnelFrame {
  oneof frame {
    TunnelHeader header = 1; // Sent in the FIRST message from client
    TunnelAck ack = 2;       // Sent in the FIRST response from WireRelay server
    // Subsequent full-duplex stream payload bytes.
    // UDP contract: each payload frame maps 1:1 to a single UDP datagram on the wire.
    // Callers MUST send one complete datagram per payload frame for UDP targets.
    bytes payload = 3;
    TunnelClose close = 4;   // Signals explicit half-close / remote EOF
  }
}
