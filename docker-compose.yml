services:
  wirerelay:
    build:
      context: .
      target: wirerelay
    container_name: wirerelay-daemon
    cap_add:
      - NET_ADMIN
    environment:
      - WIRERELAY_IFACE=${WIRERELAY_IFACE:-wg0}
      - WIRERELAY_GRPC_PORT=${WIRERELAY_GRPC_PORT:-9000}
      - WIRERELAY_HTTP_PORT=${WIRERELAY_HTTP_PORT:-8080}
      - WIREGUARD_CONF_STR=${WIREGUARD_CONF_STR:-}
      - DISABLE_IPV6=${DISABLE_IPV6:-false}
    ports:
      - "8080:8080"
      - "9000:9000"
